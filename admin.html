<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>管理后台 · 墨迹</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f7b6c'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'>墨</text></svg>">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ========== 登录 ========== -->
<div class="login-wrap" id="loginView" hidden>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo">墨</div>
    <h1>管理后台</h1>
    <p class="sub" id="loginSub">请输入管理密码继续</p>

    <div class="field">
      <label for="pwdInput">管理密码</label>
      <input type="password" id="pwdInput" placeholder="••••••••" autocomplete="current-password" required>
      <div class="tip" id="pwdTip"></div>
    </div>

    <button class="btn primary" type="submit">登录</button>

    <div class="login-hint">
      默认密码 <code>admin123</code>，登录后可在「修改密码」中更改。<br>
      内容保存在本机浏览器，<a href="index.html">返回博客 →</a>
    </div>
  </form>
</div>

<!-- ========== 后台 ========== -->
<div class="layout" id="appView" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark">墨</span>
      <span>墨迹<small>MANAGE CONSOLE</small></span>
    </div>

    <nav class="side-nav" id="sideNav">
      <div class="group">内容</div>
      <a href="#/dashboard" data-nav="dashboard"><span class="ico">▤</span>仪表盘</a>
      <a href="#/posts" data-nav="posts"><span class="ico">▦</span>文章管理<span class="badge" id="badgePosts">0</span></a>
      <a href="#/editor/new" data-nav="editor"><span class="ico">✎</span>写文章</a>
      <div class="group">组织</div>
      <a href="#/taxonomy" data-nav="taxonomy"><span class="ico">◈</span>分类与标签</a>
      <div class="group">系统</div>
      <a href="#/settings" data-nav="settings"><span class="ico">⚙</span>站点设置</a>
      <a href="#/backup" data-nav="backup"><span class="ico">⇅</span>数据备份</a>
      <a href="#/account" data-nav="account"><span class="ico">🔑</span>修改密码</a>
    </nav>

    <div class="side-foot">
      <a href="index.html" target="_blank" rel="noopener">↗ 查看博客站点</a>
      <button type="button" id="logoutBtn">⎋ 退出登录</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-bar" id="sideToggle"
              style="width:36px;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer">≡</button>
      <h1 id="pageTitle">仪表盘</h1>
      <div class="spacer"></div>
      <span class="hint" id="topHint"></span>
      <a class="btn sm" href="index.html" target="_blank" rel="noopener">预览站点</a>
    </header>

    <div class="content" id="view"></div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>
<div id="modalHost"></div>

<script src="js/store.js"></script>
<script src="js/markdown.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
